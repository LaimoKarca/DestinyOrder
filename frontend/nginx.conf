# DestinyOrder 前端 / API 反向代理設定
# - 靜態資源走 long-cache + immutable
# - index.html 不快取（SPA 部署後立即生效）
# - /api/ 轉發至 backend-api:8000，timeout 拉長以容納爬蟲較慢的回應

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 16M;

    # gzip 壓縮（HTML / JS / CSS / JSON 都會明顯縮小）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 靜態資源（Vite hash 命名）長期快取
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # BGM / 其他音訊：檔名固定但內容不會變，長快取
    location ^~ /audio/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html / SPA 入口：不快取，避免使用者拿到舊版
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # Docker 內建 DNS：backend-api 容器更新後 IP 可能改變。
    # 使用變數型 proxy_pass，使 Nginx 持續重新解析服務名稱，避免 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # API 反向代理；不指定 URI，保留原始 /api/ 請求路徑。
    location /api/ {
        set $backend_origin http://backend-api:8000;
        proxy_pass $backend_origin;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 爬蟲彙整端點可能較慢，給予較寬鬆的 timeout
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }

    # SPA 歷史模式 fallback
    #
    # Prerender 後產生了 /about/index.html、/faq/index.html、/slot/index.html
    # 等子目錄靜態 HTML，這裡用 $uri/index.html 顯式命中，避免 nginx 為
    # 沒帶 trailing slash 的請求（如 /about）回 301 → /about/，因為 SEO 上
    # 多一次 redirect 是不必要的成本。
    #
    # 命中順序：
    #   1. $uri                → 命中 dist 內的實體檔案（assets/、favicon.svg 等）
    #   2. $uri/index.html     → 命中 prerender 出來的子目錄 HTML
    #   3. /index.html         → SPA fallback（給未 prerender 的動態路徑）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/index.html /index.html;
    }

    # 自訂錯誤頁交給 SPA 處理
    error_page 404 /index.html;
}
